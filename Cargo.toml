[package]
name = "webarchive-downloader-rust"
version = "0.4.2"
edition = "2024"
description = "Download static website snapshots from the Internet Archive Wayback Machine."
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
cssparser = "0.36"
futures-util = "0.3"
html-escape = "0.2"
lol_html = "2.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate", "stream", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48", features = ["fs", "io-util", "macros", "rt-multi-thread", "signal", "time"] }
url = "2.5"

[dev-dependencies]
tempfile = "3.23"
wiremock = "0.6"
